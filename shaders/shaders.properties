# HYPERREAL SHADERS — Iris / OptiFine shader options
shadowMapResolution = 2048
shadowDistance = 96.0
shadowDistanceRenderMul = 1.0
shadowHardwareFiltering = false
shadowtex0Nearest = false
shadowtex0Mipmap = false
screen = <profile> [QUALITY] [EFFECTS]
screen.QUALITY = shadowMapResolution shadowDistance
screen.EFFECTS = BLOOM DISTANT_FOG GOD_RAYS SHADOWS
screen.columns = 2
sliders = shadowMapResolution shadowDistance
profile.LOW = shadowMapResolution:1024 shadowDistance:48
profile.MEDIUM = shadowMapResolution:1536 shadowDistance:72
profile.HIGH = shadowMapResolution:2048 shadowDistance:96
profile.ULTRA = shadowMapResolution:3072 shadowDistance:128
profile.EXTREME = shadowMapResolution:4096 shadowDistance:160
profile.CINEMATIC = shadowMapResolution:4096 shadowDistance:192