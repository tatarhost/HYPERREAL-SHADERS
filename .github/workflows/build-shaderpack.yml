name: Build Shader Pack
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shader-pack structure
        run: python tools/validate_pack.py
      - name: Install GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
      - name: Validate GLSL syntax
        run: |
          for file in shaders/*.vsh; do glslangValidator -S vert "$file"; done
          for file in shaders/*.fsh; do glslangValidator -S frag "$file"; done
      - name: Package installable ZIP
        run: python tools/package_pack.py
      - name: Upload shader-pack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HYPERREAL-SHADERS
          path: dist/HYPERREAL-SHADERS.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0-alpha"
          NOTES="Alpha release of HYPERREAL-SHADERS for Minecraft Java 1.20.4 with Iris + Sodium. Includes the current shader pipeline baseline. This is an early alpha; full volumetric clouds, advanced water reflections, global illumination and complete PBR are not implemented yet. Runtime testing in Minecraft is still required."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/HYPERREAL-SHADERS.zip --clobber
          else
            gh release create "$TAG" dist/HYPERREAL-SHADERS.zip --target "$GITHUB_SHA" --title "HYPERREAL-SHADERS v0.1.0-alpha" --notes "$NOTES"
          fi
