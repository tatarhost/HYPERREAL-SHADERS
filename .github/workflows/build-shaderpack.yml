name: Build Shader Pack
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shader-pack structure
        run: python tools/validate_pack.py
      - name: Install GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools
      - name: Validate GLSL syntax
        run: |
          for file in shaders/*.vsh; do glslangValidator -S vert "$file"; done
          for file in shaders/*.fsh; do glslangValidator -S frag "$file"; done
      - name: Package installable ZIP
        run: python tools/package_pack.py
      - name: Upload shader-pack ZIP
        uses: actions/upload-artifact@v4
        with:
          name: HYPERREAL-SHADERS
          path: dist/HYPERREAL-SHADERS.zip
          if-no-files-found: error
          retention-days: 30